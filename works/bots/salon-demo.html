<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Панель салону</title>

<style>
:root{
  --bg:#F5F1F8; --card:#FFFFFF; --card2:#FBF8FD; --text:#1D1530; --muted:#8C82A0; --faint:#B9B0C9;
  --line:rgba(29,21,48,.08); --line2:rgba(29,21,48,.05);
  --accent:#E2457E; --accent2:#8B5CF6; --accent-soft:rgba(226,69,126,.10); --violet-soft:rgba(139,92,246,.12);
  --ok:#12A16B; --ok-soft:rgba(18,161,107,.12); --bad:#E5484D; --bad-soft:rgba(229,72,77,.11);
  --warn:#E8930C; --warn-soft:rgba(245,158,11,.14); --info:#3B82F6; --info-soft:rgba(59,130,246,.12);
  --grad:linear-gradient(135deg,#FF6FA3 0%,#C84BEE 52%,#6D5CF6 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,111,163,.14),rgba(109,92,246,.14));
  --shadow:0 1px 2px rgba(31,16,56,.04),0 12px 32px -14px rgba(76,29,149,.20);
  --shadow-lg:0 24px 60px -20px rgba(76,29,149,.45);
  --r:22px; --r-sm:14px;
  --tabbar:calc(66px + env(safe-area-inset-bottom));
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#0D0A13; --card:#18141F; --card2:#1E1927; --text:#F4EFFB; --muted:#9B91AE; --faint:#5F566F;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.05);
  --accent-soft:rgba(255,111,163,.15); --violet-soft:rgba(139,92,246,.18);
  --ok-soft:rgba(18,161,107,.18); --bad-soft:rgba(229,72,77,.18); --warn-soft:rgba(245,158,11,.18); --info-soft:rgba(59,130,246,.18);
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 12px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.hidden{display:none!important}

/* ── каркас ── */
#app{max-width:640px;margin:0 auto;padding:calc(10px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)) 16px calc(var(--tabbar) + 24px)}
@media (min-width:900px){#app{max-width:760px}.sheet{max-width:760px}.tabbar .in{max-width:640px}}
.top{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
.top .who{flex:1;min-width:0}
.top .salon{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{margin:2px 0 0;font-size:25px;line-height:1.15;letter-spacing:-.02em;font-weight:750}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--text)}
.round:active{transform:scale(.94)}
.round.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 14px;position:relative}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec h2{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:720}
.sec .link{color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;gap:2px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-weight:680;font-size:15.5px}
.card-title small{font-weight:500;color:var(--muted);font-size:12.5px}

/* ── вкладки ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);
  border-top:1px solid var(--line2)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:14px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.tab svg.i{width:23px;height:23px;stroke-width:1.9}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;inset:2px 14%;border-radius:14px;background:var(--accent-soft);z-index:-1}
.tab .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:700;box-shadow:0 0 0 2px var(--card)}

/* ── сегменти та чіпи ── */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin:0 0 14px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:13.5px;font-weight:620;color:var(--muted);transition:.2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px rgba(200,75,238,.9)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.chip .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--line);font-size:11px;line-height:18px;text-align:center;color:inherit}
.chip.on .n{background:rgba(255,255,255,.2)} [data-theme=dark] .chip.on .n{background:rgba(0,0,0,.15)}
.chip .n.hot{background:var(--bad);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.pill.new{background:var(--info-soft);color:var(--info)} .pill.in_work{background:var(--violet-soft);color:var(--accent2)}
.pill.done{background:var(--ok-soft);color:var(--ok)} .pill.cancelled{background:var(--line);color:var(--muted)}
.pill.no_show{background:var(--bad-soft);color:var(--bad)} .pill.unmarked{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);font-size:12.5px;color:var(--muted);font-weight:560}

/* ── hero ── */
.hero{background:var(--grad);color:#fff;border-radius:26px;padding:18px 18px 14px;margin:0 0 14px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-90px;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.hero::after{width:180px;height:180px;left:-60px;bottom:-80px;background:radial-gradient(circle,rgba(255,214,170,.45),rgba(255,214,170,0) 70%)}
.hero .lbl{font-size:13px;font-weight:600;opacity:.88;display:flex;align-items:center;gap:6px}
.hero .big{font-size:38px;font-weight:780;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.hero .d{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:650;backdrop-filter:blur(6px)}
.hero .chart{display:block;width:calc(100% + 36px);height:84px;margin:8px -18px 4px}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.hero .row3 div{background:rgba(255,255,255,.14);border-radius:14px;padding:9px 10px;backdrop-filter:blur(6px)}
.hero .row3 b{display:block;font-size:17px;font-weight:740;letter-spacing:-.01em}
.hero .row3 span{font-size:11.5px;opacity:.85;font-weight:560}
.hero .x{position:relative;z-index:1}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.kpi{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden}
.kpi .h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.kpi .ic svg.i{width:16px;height:16px}
.kpi .v{font-size:25px;font-weight:760;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:650;color:var(--muted);margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px;padding:2px 7px;border-radius:999px}
.delta.up{color:var(--ok);background:var(--ok-soft)} .delta.down{color:var(--bad);background:var(--bad-soft)} .delta.flat{color:var(--muted);background:var(--line2)}
.ring{position:absolute;right:12px;top:46px}

/* ── списки ── */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2);min-height:52px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ava{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:750;font-size:15px;color:#fff;flex:none;background:var(--grad)}
.ava.s{width:34px;height:34px;border-radius:12px;font-size:13px}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.9)}
.ibtn.ok{background:var(--ok-soft);color:var(--ok)} .ibtn.bad{background:var(--bad-soft);color:var(--bad)} .ibtn.soft{background:var(--line2);color:var(--muted)}
.chev{color:var(--faint)}
.leaving{animation:leave .35s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(30px);height:0;min-height:0;padding:0;margin:0;border:0}}

/* ── записи ── */
.ocard{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);margin:0 0 10px;align-items:center}
.ocard:active{transform:scale(.99)}
.otime{width:58px;flex:none;text-align:center;border-radius:13px;background:var(--card2);border:1px solid var(--line2);padding:7px 2px}
.otime b{display:block;font-size:16.5px;font-weight:760;letter-spacing:-.01em}
.otime span{font-size:11px;color:var(--muted);font-weight:600}
.ocard .main{flex:1;min-width:0}
.ocard .t{font-weight:680;display:flex;align-items:center;gap:6px;min-width:0}
.ocard .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ocard .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.src{width:16px;height:16px;flex:none;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:9px}
.src.telegram{background:#2AABEE} .src.instagram{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)}
.src svg.i{width:10px;height:10px;stroke-width:2.6}

/* ── таймлайн сьогодні ── */
.tl{position:relative;padding-left:6px}
.tl-item{display:flex;gap:12px;position:relative;padding:0 0 12px}
.tl-item:last-child{padding-bottom:0}
.tl-time{width:44px;flex:none;font-weight:720;font-size:14px;padding-top:9px;text-align:right}
.tl-line{width:12px;flex:none;position:relative;display:flex;justify-content:center}
.tl-line::before{content:"";position:absolute;top:0;bottom:-12px;width:2px;background:var(--line);border-radius:2px}
.tl-item:last-child .tl-line::before{bottom:calc(100% - 22px)}
.tl-line i{position:relative;margin-top:13px;width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px var(--violet-soft)}
.tl-line i.done{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)} .tl-line i.no_show{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.tl-line i.unmarked{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)} .tl-line i.now{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--violet-soft)}}
.tl-card{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line2);border-radius:15px;padding:9px 12px}
.tl-card .t{font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── графіки ── */
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:6px}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:6px;position:relative}
.bcol.sel{background:var(--line2)}
.bcol i{display:block;width:44%;max-width:12px;border-radius:5px 5px 2px 2px;min-height:2px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bcol i.a{background:rgba(139,92,246,.24)} [data-theme=dark] .bcol i.a{background:rgba(139,92,246,.45)} .bcol i.b{background:var(--grad)}
@keyframes grow{from{transform:scaleY(0)}}
.xlabels{display:flex;gap:3px;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{min-height:20px;font-size:13px;font-weight:600;margin:-4px 0 6px;color:var(--text)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;stroke-linecap:butt;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{display:block;font-size:24px;font-weight:780;letter-spacing:-.02em;line-height:1}
.donut .c span{font-size:11.5px;color:var(--muted);font-weight:600}
.dl{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.dl div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl span{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl b{font-weight:700}
.hbar{margin:0 0 12px}
.hbar:last-child{margin:0}
.hbar .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.hbar .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar .l b{white-space:nowrap;font-weight:650;color:var(--muted);font-size:12.5px}
.track{height:9px;border-radius:9px;background:var(--line2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--grad);transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.heat{display:grid;gap:3px;align-items:center}
.heat .hl{font-size:11px;color:var(--muted);font-weight:600;padding-right:4px}
.heat .hc{aspect-ratio:1;border-radius:5px;background:var(--line2)}
.heat .hx{font-size:9.5px;color:var(--muted);text-align:center}
.split{display:flex;height:12px;border-radius:12px;overflow:hidden;gap:3px;margin:6px 0 10px}
.split i{display:block;height:100%;border-radius:4px;animation:growx .8s both}
.stars{color:#F5B301;letter-spacing:1px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty .e{font-size:34px;margin-bottom:6px}

/* ── елементи керування ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--grad);color:#fff;box-shadow:0 10px 24px -12px rgba(200,75,238,.9);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.sec2{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 10px 24px -12px var(--ok)} .btn.bad{background:var(--bad);box-shadow:0 10px 24px -12px var(--bad)}
.btn.ghost{background:none;box-shadow:none;color:var(--bad);font-weight:650}
.btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:680;font-size:14px}
.field{margin:0 0 14px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px 2px}
.field .hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent2);box-shadow:0 0 0 4px var(--violet-soft)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
.inp.err{border-color:var(--bad)}
.stepper{display:flex;align-items:center;gap:10px;background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper button:active{transform:scale(.92)}
.stepper .val{flex:1;text-align:center;font-weight:760;font-size:20px;letter-spacing:-.01em}
.stepper .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.opt{padding:7px 12px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);font-size:13.5px;font-weight:620;color:var(--muted)}
.opt.on{border-color:var(--accent2);color:var(--accent2);background:var(--violet-soft)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,1.4,.6,1)}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1.5px solid var(--line);margin:0 0 14px}
.swrow b{font-weight:640} .swrow span{display:block;font-size:12.5px;color:var(--muted)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{padding:10px 0;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:680;font-size:13.5px}
.days7 button.off{background:var(--bad-soft);color:var(--bad);border-color:transparent;text-decoration:line-through}

body.locked{position:fixed;left:0;right:0;overflow:hidden}

async function api(method, payload = {}) {
  let res;
  try {
    res = await fetch(`/app/api/${method}`, {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": INIT}, body: JSON.stringify(payload)});
  } catch (e) { throw new Error("Немає звʼязку з сервером. Перевірте інтернет."); }
  let body = null;
  try { body = await res.json(); } catch (e) { /* не JSON */ }
  if (!body) throw new Error("Сервер тимчасово недоступний.");
  if (!body.ok) { const err = new Error(body.message || "Щось пішло не так."); err.code = body.error || body.code; throw err; }
  return body.data;
}

  requestAnimationFrame(() => t.classList.add("show"));

}

/* ── графіки ── */
function smooth(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, t = 0.18;
    const c1 = [p1[0] + (p2[0] - p0[0]) * t, p1[1] + (p2[1] - p0[1]) * t], c2 = [p2[0] - (p3[0] - p1[0]) * t, p2[1] - (p3[1] - p1[1]) * t];
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]);
    c1[1] = Math.min(Math.max(c1[1], lo), hi); c2[1] = Math.min(Math.max(c2[1], lo), hi);
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function area(values, w = 340, h = 84, color = "#fff") {
  const max = Math.max(1, ...values), n = values.length;
  const pts = values.map((v, i) => [n === 1 ? w / 2 : (i * w) / (n - 1), h - 8 - (v / max) * (h - 22)]);
  const line = smooth(pts);
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".42"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${w},${h} L0,${h} Z" fill="url(#ga)"/><path class="draw" d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}" vector-effect="non-scaling-stroke"/>` : ""}</svg>`;
}
function ring(p, size = 44, color = "var(--accent2)") {
  const r = (size - 7) / 2, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, p || 0));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * v) / 100} ${c}"/></svg>`;
}
function donut(segs, total, label) {
  const r = 52, c = 2 * Math.PI * r, sum = segs.reduce((a, s) => a + s.v, 0) || 1;
  let off = 0;
  const circles = segs.filter((s) => s.v).map((s) => { const len = (s.v / sum) * c, gap = segs.filter((x) => x.v).length > 1 ? 2.5 : 0; const el = `<circle cx="66" cy="66" r="${r}" stroke="${s.c}" stroke-dasharray="${Math.max(0, len - gap)} ${c}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join("");
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" stroke="var(--line2)"/>${circles}</svg><div class="c"><div><b>${nf(total)}</b><span>${label}</span></div></div></div>
    <div class="dl">${segs.map((s) => `<div><i style="background:${s.c}"></i><span>${s.l}</span><b class="num">${nf(s.v)}</b></div>`).join("")}</div></div>`;

function deltaChip(cur, prev, {inverse = false, points = false} = {}) {
  if (cur == null || prev == null) return "";
  let diff, text;
  if (points) { diff = cur - prev; text = `${Math.abs(diff) < 10 ? Math.abs(diff).toFixed(1).replace(".0", "") : Math.round(Math.abs(diff))} п.п.`; }
  else { if (!prev) return cur ? `<span class="delta up">нове</span>` : ""; diff = ((cur - prev) / prev) * 100; text = `${Math.round(Math.abs(diff))}%`; }
  if (Math.abs(diff) < 0.5) return `<span class="delta flat">≈ 0</span>`;
  const good = inverse ? diff < 0 : diff > 0;
  return `<span class="delta ${good ? "up" : "down"}">${diff > 0 ? "↑" : "↓"} ${text}</span>`;
}

function revealChip(box) {
  /* обрана вкладка/день — у полі зору: гортаємо лише сам рядок, не сторінку */

function shrinkImage(file, limit = 900000) {
  /* JPEG до ~650 КБ: сервер приймає запити до 1 МБ, а Telegram однаково стискає фото */
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      let max = 1600, quality = 0.86, out = "";
      for (let i = 0; i < 8; i++) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        out = cv.toDataURL("image/jpeg", quality);
        if (out.length <= limit) break;
        if (quality > 0.7) quality -= 0.08; else max = Math.round(max * 0.8);
      }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не вдалося відкрити фото")); };
    img.src = url;
  });
}
async function uploadPhotos(serviceId, files) {

    const data = await run(null, () => api("portfolio_add", {service_id: serviceId, image}));
    ph.remove();
    if (!data) break;
    setBoot(data);
    renderPhotos(serviceId, data.photos);
  }
  toast("Фото додано");
}

/* ── шторки ── */
let lockedAt = 0;
function lockPage(on) {
  const body = document.body;
  if (on === body.classList.contains("locked")) return;
  if (on) { lockedAt = window.scrollY; body.style.top = `-${lockedAt}px`; body.classList.add("locked"); }
  else { body.classList.remove("locked"); body.style.top = ""; window.scrollTo(0, lockedAt); }
}
function openSheet(title, renderFn, opts = {}) {
  lockPage(true);
  S.sheets.push({title, renderFn, opts});
  drawSheet();
  const sheet = $("#sheet"), scrim = $("#scrim");
  sheet.classList.remove("hidden"); scrim.classList.remove("hidden");
  requestAnimationFrame(() => { sheet.classList.add("show"); scrim.classList.add("show"); });
  try { tg.BackButton.show(); } catch (e) { /* поза Telegram */ }
}
function drawSheet() {
  const top = S.sheets[S.sheets.length - 1];
  if (!top) return;
  $("#sheet-title").textContent = top.title;
  $("#sheet-body").innerHTML = top.renderFn();
  $("#sheet-body").scrollTop = 0;
  top.opts.onMount && top.opts.onMount();
}
function closeSheet(all = false) {
  if (!S.sheets.length) return;
  if (all) S.sheets = []; else S.sheets.pop();
  if (S.sheets.length) { drawSheet(); return; }
  $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show");
  lockPage(false);
  setTimeout(() => { if (!S.sheets.length) { $("#sheet").classList.add("hidden"); $("#scrim").classList.add("hidden"); } }, 320);
  try { tg.BackButton.hide(); } catch (e) { /* поза Telegram */ }
}
const inSheet = (sel) => $(sel, $("#sheet-body"));

/* ── дані ── */
async function boot() {
  if (!INIT) { gate("outside"); return; }
  skeleton();
  try {
    S.boot = await api("bootstrap");
  } catch (e) { gate(e.code === "forbidden" ? "forbidden" : e.code === "auth" ? "auth" : "error"); return; }
  if (isOwner()) {
    $("#tabbar").classList.remove("hidden");
    render();
    refreshDash();
  } else {
    S.tab = "orders";
    loadOrders();
  }
  if (new URLSearchParams(location.search).get("open") === "new") openBooking();  // з кнопки «📝 Або формою в панелі»
}
async function refreshDash() {
  if (!isOwner()) return;
  try {
    const d = await api("dashboard", {days: S.days});
    S.dash = d;
    S.boot.attention = d.attention;
    if (S.tab === "home" && !S.sheets.length) render(); else renderTabs();
  } catch (e) { if (e.code === "auth") gate("auth"); else toast(e.message, true); }
}
async function refreshAll(btn) {
  btn && btn.classList.add("spin");
  try { const b = await api("bootstrap"); S.boot = b; } catch (e) { toast(e.message, true); }
  if (!isOwner()) S.tab = "orders";
  await refreshDash();
  if (S.tab === "orders") await loadOrders();
  else render();
  btn && btn.classList.remove("spin");
}

  },
  copy(el) {
    const text = el.dataset.text;
    const fallback = () => { const t = document.createElement("textarea"); t.value = text; t.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) { /* ні */ } t.remove(); toast(ok ? "Скопійовано" : "Не вдалося скопіювати — виділіть текст вручну", !ok); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast("Скопійовано"), fallback);
  },
  tg(el) { const url = `https://t.me/${el.dataset.user}`; try { tg.openTelegramLink(url); } catch (e) { window.open(url, "_blank"); } },
  link(el) { const url = el.dataset.url; try { tg.openLink(url); } catch (e) { window.open(url, "_blank"); } },
  "sheet-close"() { closeSheet(); },
  sw(el) { el.classList.toggle("on"); haptic("select"); },

  /* послуги */
  "svc-open"(el) {
    if (S.reorder) return;
    const id = Number(el.dataset.id);
    const s = id ? svcById(id) : {id: 0, title: "", price: "", minutes: 60, repeat_days: 0, deposit: 0, active: true, photos: 0};
    if (!s) return;
    haptic();
    openSheet(id ? s.title : "Нова послуга", () => svcSheet(s), {onMount: () => id && loadPhotos(id)});
  },
  dur(el) { const inp = inSheet("#s-min"); setDur(Math.min(600, Math.max(5, Number(inp.value) + Number(el.dataset.d)))); haptic("select"); },
  "dur-set"(el) { setDur(Number(el.dataset.m)); haptic("select"); },
  "rep-set"(el) { inSheet("#s-rep").value = el.dataset.d; $$(".opt[data-act=rep-set]", $("#sheet-body")).forEach((o) => o.classList.toggle("on", o === el)); haptic("select"); },
  async "svc-save"(el) {
    const id = Number(el.dataset.id);
    const payload = {title: inSheet("#s-title").value, price: inSheet("#s-price").value, minutes: Number(inSheet("#s-min").value), repeat_days: inSheet("#s-rep").value.trim() || "0", deposit: inSheet("#s-dep").value.trim() || "0", active: inSheet("#s-act").classList.contains("on")};
    if (id) payload.id = id;
    const data = await run(el, () => api("service_save", payload));
    if (!data) return;
    setBoot(data); toast(id ? "Збережено" : "Послугу додано"); closeSheet(); render();
    if (!id && data.saved_id) { const s = svcById(data.saved_id); if (s) openSheet(s.title, () => svcSheet(s), {onMount: () => loadPhotos(s.id)}); }
  },
  async "svc-delete"(el) {
    const s = svcById(Number(el.dataset.id));
    if (!s || !(await confirmBox(`Видалити «${s.title}»? Уже створені записи залишаться.`))) return;
    const data = await run(el, () => api("service_delete", {id: s.id}));
    if (data) { setBoot(data); toast("Послугу видалено"); closeSheet(); render(); }
  },
  async "svc-toggle"(el) {
    const s = svcById(Number(el.dataset.id));
    if (!s) return;
    el.classList.toggle("on"); haptic("select");
    const data = await run(null, () => api("service_save", {...s, active: !s.active}));
    if (data) { setBoot(data); toast(s.active ? "Послугу приховано" : "Послуга знову в меню"); }
    render();
  },
  "svc-reorder"() { S.reorder = !S.reorder; haptic(); render(); },
  async "svc-move"(el) {
    const ids = S.boot.services.map((s) => s.id), i = ids.indexOf(Number(el.dataset.id)), j = i + Number(el.dataset.dir);
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    haptic("select");
    const data = await run(null, () => api("service_order", {ids}));
    if (data) { setBoot(data); render(); }
  },
  async "photo-del"(el) {
    if (!(await confirmBox("Видалити це фото?"))) return;
    const data = await run(null, () => api("portfolio_delete", {id: Number(el.dataset.id)}));
    if (data) { setBoot(data); renderPhotos(Number(el.dataset.sid), data.photos); toast("Фото видалено"); }
  },

  /* команда */
  "mst-open"(el) {
    const id = Number(el.dataset.id);
    const m = id ? mstById(id) : {id: 0, name: "", service_ids: [], days_off: [], telegram_id: null, calendar_id: "", active: true};
    if (!m) return;
    haptic();
    openSheet(id ? m.name : "Новий майстер", () => mstSheet((id && mstById(id)) || m));
  },
  "mst-all"(el) { $$("#m-svc .opt", $("#sheet-body")).forEach((o) => o.classList.toggle("on", o === el)); haptic("select"); },
  "mst-svc"(el) {
    el.classList.toggle("on");
    const box = inSheet("#m-svc"), any = $$(".opt[data-act=mst-svc].on", box).length;
    $(".opt[data-act=mst-all]", box).classList.toggle("on", !any);
    haptic("select");
  },
  "mst-day"(el) { el.classList.toggle("off"); haptic("select"); },
  async "mst-tg-link"(el) {
    const data = await run(el, () => api("master_link", {id: Number(el.dataset.id)}));
    if (!data) return;
    const short = data.text.replace(` ${data.link}`, "").replace(/:\s*$/, "");
    openSheet("Посилання для майстра", () => `<div class="infobox">Надішліть майстру — відкриє, натисне «Start», і Telegram привʼяжеться сам. Посилання спрацює один раз і діє ${data.days} днів.</div>
      <div class="bubble">${esc(data.text)}</div>
      <div class="share"><button class="btn sec2" data-act="copy" data-text="${esc(data.text)}">${ic("copy")} Скопіювати</button><button class="btn sec2" data-act="tg-share" data-url="${esc(data.link)}" data-text="${esc(short)}">${ic("send")} У Telegram</button></div>`);
  },
  "mst-tg-pick"(el) { openSheet("Обрати з тих, хто писав боту", () => botUsersSheet(el.dataset.id), {onMount: loadBotUsers}); },
  async "mst-tg-set"(el) {
    const master = mstById(Number(el.dataset.id));
    if (!master || !(await confirmBox(`Привʼязати «${el.dataset.name}» як Telegram майстра ${master.name}?`))) return;
    const data = await run(null, () => api("master_telegram", {id: master.id, telegram_id: Number(el.dataset.uid)}));
    if (data) { setBoot(data); toast("Telegram майстра привʼязано"); closeSheet(); render(); }
  },
  async "mst-tg-unlink"(el) {
    const master = mstById(Number(el.dataset.id));
    if (!master || !(await confirmBox(`Відвʼязати Telegram від майстра ${master.name}? Розклад йому більше не приходитиме.`))) return;
    const data = await run(el, () => api("master_telegram", {id: master.id, telegram_id: null}));
    if (data) { setBoot(data); toast("Відвʼязано"); drawSheet(); render(); }
  },
  async "mst-save"(el) {
    const id = Number(el.dataset.id), tgv = inSheet("#m-tg").value.trim();
    if (tgv && !/^\d{3,13}$/.test(tgv)) { toast("Telegram ID — це число, напр. 123456789", true); return; }
    const payload = {
      name: inSheet("#m-name").value,
      service_ids: $$("#m-svc .opt[data-act=mst-svc].on", $("#sheet-body")).map((o) => Number(o.dataset.id)),
      days_off: $$("#m-days button.off", $("#sheet-body")).map((o) => Number(o.dataset.d)),
      telegram_id: tgv ? Number(tgv) : null, calendar_id: inSheet("#m-cal").value.trim(), active: inSheet("#m-act").classList.contains("on"),
    };
    if (id) payload.id = id;
    const data = await run(el, () => api("master_save", payload));
    if (data) { setBoot(data); toast(id ? "Збережено" : "Майстра додано"); closeSheet(); render(); }
  },
  async "mst-delete"(el) {
    const m = mstById(Number(el.dataset.id));
    if (!m || !(await confirmBox(`Видалити майстра «${m.name}»? Уже створені записи залишаться.`))) return;
    const data = await run(el, () => api("master_delete", {id: m.id}));
    if (data) { setBoot(data); toast("Майстра видалено"); closeSheet(); render(); }
  },
  async "mst-toggle"(el) {
    const m = mstById(Number(el.dataset.id));
    if (!m) return;
    el.classList.toggle("on"); haptic("select");
    const data = await run(null, () => api("master_save", {...m, active: !m.active}));
    if (data) { setBoot(data); toast(m.active ? "Майстер не приймає записи" : "Майстер знову приймає записи"); }
    render();
  },
  "hours-toggle"(el) {
    const d = Number(el.dataset.d), row = el.closest(".hrow"), on = !el.classList.contains("on");
    el.classList.toggle("on", on); haptic("select");
    const keep = row.querySelector(".sw");
    row.innerHTML = `<span class="dn">${WD[d]}</span>${on ? `<input type="time" step="900" data-h="from" value="09:00"><span class="muted">—</span><input type="time" step="900" data-h="to" value="20:00">` : `<span class="closed">вихідний</span>`}`;
    row.appendChild(keep);
    $("#hours-save").classList.remove("hidden");
  },
  async "hours-save"(el) {
    const hours = $$("#hours .hrow").map((row) => { const f = row.querySelector("[data-h=from]"), t = row.querySelector("[data-h=to]"); return f ? {from: f.value, to: t.value} : null; });
    const data = await run(el, () => api("hours_save", {hours}));
    if (data) { setBoot(data); toast("Графік збережено"); render(); }
  },
  "closed-open"() { haptic(); openSheet("Вихідні дні", closedSheet); },
  async "closed-add"(el) {
    const from = inSheet("#c-from").value, to = inSheet("#c-to").value || from;
    if (!from) { toast("Оберіть дату", true); return; }
    const data = await run(el, () => api("closed_add", {from, to}));
    if (!data) return;
    setBoot(data); render();
    if (data.conflicts && data.conflicts.length) {
      toast("Вихідні додано — але на ці дні є записи", true);
      inSheet("#c-conf").innerHTML = `<div class="warnbox">⚠️ <div><b>На ці дні вже є записи — перенесіть їх:</b>${data.conflicts.map((o) => `<div style="margin-top:6px" data-act="open-order" data-id="${o.id}">• ${esc(whenLabel(o.start))} — ${esc(o.name)}, ${esc(o.service)}</div>`).join("")}</div></div>`;
    } else { toast("Вихідні додано"); closeSheet(); }
  },
  async "closed-del"(el) {
    const data = await run(null, () => api("closed_remove", {day: el.dataset.day}));
    if (data) { setBoot(data); toast("Знову робочий день"); render(); }
  },

  /* ще */
  "set-open"(el) { const g = el.dataset.group; haptic(); openSheet(SET_GROUPS[g][0], () => setSheet(g)); },
  async "set-save"(el) {
    const values = {};
    $$("[data-key]", $("#sheet-body")).forEach((inp) => { if (inp.value.trim() !== inp.dataset.orig) values[inp.dataset.key] = inp.value.trim(); });
    if (!Object.keys(values).length) { closeSheet(); return; }
    const data = await run(el, () => api("settings_save", {values}));
    if (data) { setBoot(data); toast("Збережено — бот уже працює за новими правилами"); closeSheet(); render(); }
  },
  async "set-reset"(el) {
    const data = await run(el, () => api("settings_reset", {key: el.dataset.key}));
    if (data) { setBoot(data); toast("Повернуто типове значення"); drawSheet(); render(); }
  },
  "bonus-open"() { haptic(); openSheet("Бонуси й знижки", bonusSheet); },
  async "bonus-save"(el) {
    const payload = {};
    $$("[data-bonus]", $("#sheet-body")).forEach((inp) => { payload[inp.dataset.bonus] = inp.value.trim() || "0"; });
    const data = await run(el, () => api("bonus_save", payload));
    if (data) { setBoot(data); toast("Бонуси збережено"); closeSheet(); render(); }
  },
  "faq-open"() { haptic(); openSheet("Питання та відповіді", faqSheet); },
  "faq-edit"(el) {
    const id = Number(el.dataset.id), f = id ? S.boot.faq.find((x) => x.id === id) : {id: 0, question: "", answer: ""};
    if (f) openSheet(id ? "Редагувати питання" : "Нове питання", () => faqEditSheet(f));
  },
  async "faq-save"(el) {
    const id = Number(el.dataset.id), payload = {question: inSheet("#f-q").value, answer: inSheet("#f-a").value};
    if (id) payload.id = id;
    const data = await run(el, () => api("faq_save", payload));
    if (data) { setBoot(data); toast("Збережено"); closeSheet(); drawSheet(); render(); }
  },
  async "faq-del"(el) {
    if (!(await confirmBox("Видалити це питання?"))) return;
    const data = await run(el, () => api("faq_delete", {id: Number(el.dataset.id)}));
    if (data) { setBoot(data); toast("Видалено"); closeSheet(); drawSheet(); render(); }
  },
  "bc-open"() { haptic(); openSheet("Розсилка", bcSheet); },
  async "bc-send"(el) {
    const text = inSheet("#bc-text").value.trim();
    if (!text) { toast("Напишіть текст розсилки", true); inSheet("#bc-text").focus(); return; }
    const n = S.boot.audience;
    if (!(await confirmBox(`Надіслати ${n} ${plural(n, "клієнтці", "клієнткам", "клієнткам")}? Скасувати після запуску не можна.`))) return;
    const data = await run(el, () => api("broadcast", {text}));
    if (data) { setBoot(data); toast("Розсилку запущено — звіт прийде в чат із ботом"); closeSheet(); render(); }
  },
  "ban-open"() { haptic(); openSheet("Чорний список", banSheet); },
  async unban(el) {
    const data = await run(el, () => api("unban", {user_id: el.dataset.uid}));  // рядком: ID клієнток «по телефону» > 2^53
    if (data) { setBoot(data); toast("Розблоковано"); drawSheet(); render(); }
  },
};
function setCustomTime(value) {
  const b = S.bk;
  b.start = value ? `${b.day}T${value}:00` : null;
}
function setDur(m) {
  inSheet("#s-min").value = m;
  inSheet("#s-dur-v").innerHTML = `${dur(m)}<small>скільки часу займає в розкладі</small>`;
  $$(".opt[data-act=dur-set]", $("#sheet-body")).forEach((o) => o.classList.toggle("on", Number(o.dataset.m) === m));
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "bk-date" && e.target.value) {
    if (e.target.value < S.boot.today) { e.target.value = S.boot.today; }
    S.bk.day = e.target.value; S.bk.start = null; bkRefresh("days"); bkLoadSlots();
  }
  if (e.target.id === "bk-time") { setCustomTime(e.target.value); $$("#bk-slots .slot", $("#sheet-body")).forEach((x) => x.classList.remove("on")); }
  const up = e.target.closest("[data-upload]");
  if (up && up.files.length) { uploadPhotos(Number(up.dataset.upload), [...up.files].slice(0, S.boot.portfolio_limit)); up.value = ""; }
  if (e.target.closest("#hours")) $("#hours-save").classList.remove("hidden");
});
let qTimer = 0;
document.addEventListener("input", (e) => {
  if (e.target.id === "bk-phone") bkPhoneInput(e.target.value);
  if (e.target.id === "bu-q") { clearTimeout(qTimer); qTimer = setTimeout(loadBotUsers, 300); }
  if (e.target.id === "q") { S.q = e.target.value; S.qFocus = true; clearTimeout(qTimer); qTimer = setTimeout(() => loadOrders(), 380); }
  if (e.target.id === "bc-text") {
    const v = e.target.value;
    $("#bc-n").textContent = v.length;
    $("#bc-prev").innerHTML = v.trim() ? esc(v) : `<span class="muted">Почніть писати…</span>`;
  }
  if (e.target.closest("#hours")) $("#hours-save").classList.remove("hidden");
});
document.addEventListener("focusout", (e) => { if (e.target.id === "q") S.qFocus = false; });
boot();
</script>
<script>
/* ═══════════ ДЕМО: відкриття екрана з location.hash, напр. #tab=orders&ov=unmarked&theme=dark&sheet=order:today:2&scroll=600 ═══════════ */
(function () {
  var H = (window.__demo && window.__demo.HASH) || {};
  if (!Object.keys(H).length) return;
  if (H.still) { var st = document.createElement("style"); st.textContent = ".sheet,.scrim,.toast{transition:none!important}"; document.head.appendChild(st); }
  var tries = 0;
  var t = setInterval(function () {
    if (++tries > 100) { clearInterval(t); return; }
    if (typeof S === "undefined" || !S.boot) return;
    clearInterval(t);
    try {
      if (H.days && [7, 30, 90, 365].indexOf(+H.days) >= 0 && +H.days !== S.days) { A.period({dataset: {days: H.days}}); }
      if (H.ov) S.ov = H.ov;
      if (H.tab && H.tab !== "home") A.tab({dataset: {tab: H.tab}});
    } catch (e) { console.error(e); }
    var w = 0, poll = setInterval(function () {
      w++;
      var ready = (S.tab === "home" ? !!S.dash : !S.ordersLoading) || w > 40;
      if (!ready) return;
      clearInterval(poll);
      setTimeout(function () {
        try {
          var sh = H.sheet || "", p = sh.split(":");
          if (p[0] === "order") {
            var id = p[1] === "today" ? window.__demo.todayIds()[+p[2] || 0] : +p[1];
            openOrder(id);
          } else if (p[0] === "book") A["book-open"]({dataset: {}});
          else if (p[0] === "svc") A["svc-open"]({dataset: {id: p[1] || "0"}});
          else if (p[0] === "mst") A["mst-open"]({dataset: {id: p[1] || "0"}});
          else if (p[0] === "closed") A["closed-open"]({dataset: {}});
          else if (p[0] === "set") A["set-open"]({dataset: {group: p[1] || "salon"}});
          else if (p[0] === "bonus") A["bonus-open"]({dataset: {}});
          else if (p[0] === "faq") A["faq-open"]({dataset: {}});
          else if (p[0] === "bc") A["bc-open"]({dataset: {}});
          else if (p[0] === "ban") A["ban-open"]({dataset: {}});
        } catch (e) { console.error(e); }
        if (H.scroll) setTimeout(function () { window.scrollTo(0, +H.scroll); }, 1200);
      }, 900);
    }, 150);
  }, 100);
})();
</script>
</body>
