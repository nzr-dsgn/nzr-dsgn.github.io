.bcol i{display:block;width:44%;max-width:12px;border-radius:5px 5px 2px 2px;min-height:2px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bcol i.a{background:rgba(139,92,246,.24)} [data-theme=dark] .bcol i.a{background:rgba(139,92,246,.45)} .bcol i.b{background:var(--grad)}
@keyframes grow{from{transform:scaleY(0)}}
.xlabels{display:flex;gap:3px;margin-top:6px}
.xlabels span{flex:1;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{min-height:20px;font-size:13px;font-weight:600;margin:-4px 0 6px;color:var(--text)}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;stroke-linecap:butt;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{display:block;font-size:24px;font-weight:780;letter-spacing:-.02em;line-height:1}
.donut .c span{font-size:11.5px;color:var(--muted);font-weight:600}
.dl{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.dl div{display:grid;grid-template-columns:10px 1fr;column-gap:8px;row-gap:1px;align-items:center;font-size:13.5px}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl span{color:var(--muted);overflow-wrap:anywhere}
.dl b{font-weight:700;grid-column:2}
.hbar{margin:0 0 12px}
.hbar:last-child{margin:0}
.hbar .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.hbar .l span{overflow-wrap:anywhere;font-weight:600}
.hbar .l b{white-space:nowrap;font-weight:650;color:var(--muted);font-size:12.5px}
.track{height:9px;border-radius:9px;background:var(--line2);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--grad);transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.heat{display:grid;gap:3px;align-items:center}
.heat .hl{font-size:11px;color:var(--muted);font-weight:600;padding-right:4px}
.heat .hc{aspect-ratio:1;border-radius:5px;background:var(--line2)}
.heat .hx{font-size:9.5px;color:var(--muted);text-align:center}
.split{display:flex;height:12px;border-radius:12px;overflow:hidden;gap:3px;margin:6px 0 10px}
.split i{display:block;height:100%;border-radius:4px;animation:growx .8s both}
.stars{color:#F5B301;letter-spacing:1px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.empty .e{font-size:34px;margin-bottom:6px}

/* ── елементи керування ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:16px;font-weight:700;font-size:15.5px;background:var(--grad);color:#fff;box-shadow:0 10px 24px -12px rgba(200,75,238,.9);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.sec2{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 10px 24px -12px var(--ok)} .btn.bad{background:var(--bad);box-shadow:0 10px 24px -12px var(--bad)}
.btn.ghost{background:none;box-shadow:none;color:var(--bad);font-weight:650}
.btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{padding-left:8px;padding-right:8px}
@media (max-width:360px){.btn{font-size:14.5px}}
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:680;font-size:14px}
@media (max-width:380px){.top .addbtn{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%;flex:none}.top .addbtn span{display:none}}
.field{margin:0 0 14px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:0 0 6px 2px}
.field .hint{font-size:12px;color:var(--muted);margin:6px 2px 0}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);outline:none;font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent2);box-shadow:0 0 0 4px var(--violet-soft)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.45}
.inp.err{border-color:var(--bad)}
.stepper{display:flex;align-items:center;gap:10px;background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper button:active{transform:scale(.92)}
.stepper .val{flex:1;text-align:center;font-weight:760;font-size:20px;letter-spacing:-.01em}
.stepper .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.opt{padding:7px 12px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);font-size:13.5px;font-weight:620;color:var(--muted)}
.opt.on{border-color:var(--accent2);color:var(--accent2);background:var(--violet-soft)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,1.4,.6,1)}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1.5px solid var(--line);margin:0 0 14px}
.swrow b{font-weight:640} .swrow span{display:block;font-size:12.5px;color:var(--muted)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days7 button{padding:10px 0;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:680;font-size:13.5px}
.days7 button.off{background:var(--bad-soft);color:var(--bad);border-color:transparent;text-decoration:line-through}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.hrow:nth-child(7){border:0}
.hrow .dn{width:30px;font-weight:720}
.hrow input[type=time]{flex:1;min-width:0;padding:9px 8px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);font-size:15px;text-align:center}
.hrow .closed{flex:1;text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:10px 0}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--line2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .4s}
.ph button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.ph button svg.i{width:14px;height:14px}
.ph.add{display:grid;place-items:center;border:1.5px dashed var(--faint);background:none;color:var(--muted);font-size:12px;font-weight:620;text-align:center}
.ph.add input{position:absolute;inset:0;opacity:0}
.ph.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.1s infinite}
@keyframes fade{from{opacity:0}}
.menu{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin:0 0 14px}
.mi{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line2)}
.mi:last-child{border:0}
.mi:active{background:var(--line2)}
.mi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
.mi .ic svg.i{width:18px;height:18px}
.mi .main{flex:1;min-width:0} .mi .t{font-weight:640} .mi .sub{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.kv:last-child{border:0}
.kv span{color:var(--muted);flex:none} .kv b{font-weight:620;text-align:right;min-width:0;word-break:break-word}
.kv a{color:var(--accent);text-decoration:none;font-weight:650}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat3 div{background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:10px;text-align:center}
.stat3 b{display:block;font-size:20px;font-weight:760} .stat3 span{font-size:11.5px;color:var(--muted);font-weight:600}
.note{background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:9px 12px;margin:0 0 8px;font-size:14px}
.note small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.badge{display:inline-block;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--text);border-radius:14px;padding:11px 13px;font-size:13.5px;margin:0 0 14px}
.ship-timer{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:7px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.ship-timer b{padding:3px 10px;border-radius:999px;background:var(--violet-soft);color:var(--text);font-weight:700;white-space:nowrap}
.ship-timer.hot b{background:var(--bad-soft);color:var(--bad)}
.infobox{background:var(--grad-soft);border-radius:14px;padding:11px 13px;font-size:13.5px;margin:0 0 14px;color:var(--text)}
.qr-count{font-size:13px;font-weight:650;color:var(--muted);margin:2px 2px 10px}
.qr-card{background:var(--card);border-radius:18px;padding:10px 12px 12px;margin:0 0 12px;box-shadow:var(--shadow);transition:box-shadow .3s}
.qr-card.moved{box-shadow:0 0 0 2px var(--accent2),var(--shadow)}
.qr-head{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.qr-head b{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--muted)}
.ibtn.sm{width:34px;height:34px;border-radius:10px}
.ibtn:disabled{opacity:.3}
.qr-card textarea.inp{min-height:92px;margin-top:8px}
.qr-ins{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qr-ins .chip{padding:6px 10px;font-size:12.5px;box-shadow:none;background:var(--line2);gap:4px}
.qr-ins .chip .i{width:13px;height:13px}
.qr-auto{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.qr-auto small{font-size:12.5px;color:var(--muted);font-weight:600}
.qr-auto span{padding:3px 9px;border-radius:999px;background:var(--card);font-size:12.5px;font-weight:600;white-space:nowrap}
.bubble{background:var(--card2);border:1px solid var(--line2);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;white-space:pre-wrap;word-break:break-word;min-height:42px}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:5px}

/* ── шторка ── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,6,18,.45);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:calc(var(--tg-viewport-stable-height, 100vh) - 28px);display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.sheet .sh,.sheet .grab{touch-action:none}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--faint);margin:9px auto 0;opacity:.6;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:none}
.sheet .sh h3{flex:1;margin:0;font-size:19px;font-weight:740;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.sheet .sh .x{width:34px;height:34px;border-radius:50%;background:var(--line2);display:grid;place-items:center;color:var(--muted)}
.sheet .sb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 16px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));margin:6px -16px calc(-18px - env(safe-area-inset-bottom));padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* ── тости, скелетони ── */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(var(--tabbar) + 14px);z-index:60;transform:translateY(20px);opacity:0;transition:.28s cubic-bezier(.2,.9,.25,1);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:620;font-size:14px;box-shadow:0 14px 40px -12px rgba(0,0,0,.45);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:none}
.sheet.show ~ .toast{bottom:calc(104px + env(safe-area-inset-bottom))}
.toast.err{background:var(--bad);color:#fff}
.sk{border-radius:var(--r);background:var(--card);margin:0 0 14px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--line2),transparent);animation:shimmer 1.2s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.appear{animation:appear .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes appear{from{opacity:0;transform:translateY(10px)}}
.gate{min-height:80vh;display:grid;place-items:center;text-align:center;padding:30px}
.gate .logo{width:76px;height:76px;border-radius:24px;background:var(--grad);display:grid;place-items:center;margin:0 auto 16px;color:#fff;box-shadow:var(--shadow-lg)}
.gate .logo svg.i{width:36px;height:36px}
.gate h2{margin:0 0 8px;font-size:22px} .gate p{color:var(--muted);margin:0 auto;max-width:300px}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* ── запис клієнтки ── */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:11px 0;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:720;font-size:15px;transition:.15s}
.slot.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px rgba(200,75,238,.9)}
.slot:active{transform:scale(.95)}
.chip.off{opacity:.5;text-decoration:line-through}
.chip.dayc{flex-direction:column;gap:0;padding:8px 12px;min-width:58px;border-radius:16px;line-height:1.2}
.chip.dayc b{font-size:15px;color:var(--text)} .chip.dayc.on b{color:var(--bg)}
.chip.dayc small{font-size:11px;font-weight:650}
.opt small{display:block;font-size:11px;font-weight:600;opacity:.75}
.cli{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:-4px 0 14px;animation:appear .3s both}
.cli .main{flex:1;min-width:0;font-size:13.5px;color:var(--muted)} .cli b{color:var(--text);font-size:15px}
.cli.new{color:var(--muted);font-size:14px;align-items:center}
.cli .line{margin-top:3px}
.bkdone{text-align:center;padding:10px 0 16px}
.bkdone .okc{width:72px;height:72px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;background:var(--ok);color:#fff;box-shadow:0 14px 30px -12px var(--ok);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.bkdone .okc svg.i{width:36px;height:36px;stroke-width:2.6}
.bkdone h3{margin:0 0 6px;font-size:22px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.share .btn{padding:12px 10px;font-size:14px;text-decoration:none}
.src.phone{background:#12A16B} .src.walkin{background:#E8930C}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}

/* ── магазин ── */
.pill.confirmed{background:var(--violet-soft);color:var(--accent2)} .pill.shipped{background:var(--warn-soft);color:var(--warn)}
.pill.delivered{background:var(--ok-soft);color:var(--ok)} .pill.returned{background:var(--bad-soft);color:var(--bad)}
.pill.paid{background:var(--ok-soft);color:var(--ok)} .pill.unpaid{background:var(--warn-soft);color:var(--warn)} .pill.cod{background:var(--info-soft);color:var(--info)}
.src.manual{background:#12A16B}
.thumb{width:58px;height:58px;border-radius:15px;flex:none;background:var(--card2) center/cover no-repeat;border:1px solid var(--line2);display:grid;place-items:center;color:var(--faint)}
.thumb.s{width:44px;height:44px;border-radius:12px}
.pcard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px 12px 10px 10px;box-shadow:var(--shadow);margin:0 0 10px}
.pcard:active{transform:scale(.99)}
.pcard .main{flex:1;min-width:0} .pcard .t{font-weight:680;overflow-wrap:anywhere}
.pcard .sub{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard.off{opacity:.55}
.price-old{text-decoration:line-through;color:var(--faint);font-size:12.5px}
.stock{font-weight:700;font-size:12px;padding:2px 7px;border-radius:7px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.stock.low{background:var(--warn-soft);color:var(--warn)} .stock.zero{background:var(--bad-soft);color:var(--bad)}
.vhead,.vrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 116px 34px;gap:6px;align-items:center}
.vhead{font-size:11.5px;color:var(--muted);font-weight:650;margin:0 2px 6px}
.vrow{margin:0 0 8px}
@media (max-width:360px){.vhead,.vrow{grid-template-columns:minmax(0,1fr) 54px 100px 30px;gap:5px}.vrow .mini button{width:26px}}
.vrow>input{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);font-size:15px;width:100%;min-width:0;outline:none}
.vrow>input:focus{border-color:var(--accent2)}
.vrow .mini{display:flex;align-items:center;gap:3px;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.vrow .mini button{width:30px;height:32px;border-radius:9px;background:var(--card);box-shadow:var(--shadow);font-size:18px;flex:none}
.vrow .mini input{border:0;background:none;text-align:center;padding:6px 0;font-weight:700;width:100%;min-width:0;font-size:15px;outline:none}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.post{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:var(--line2) center/cover no-repeat;cursor:pointer}
.post .lb{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:650;border-radius:8px;padding:3px 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;backdrop-filter:blur(4px)}
.post.on{box-shadow:inset 0 0 0 3px var(--accent2)}
.funnel .fr{display:flex;align-items:center;gap:10px;margin:0 0 9px}
.funnel .fr span{width:120px;font-size:13px;color:var(--muted);font-weight:600;flex:none}
.funnel .fr .track{flex:1;height:22px;border-radius:8px}
.funnel .fr .track i{border-radius:8px}
.funnel .fr b{width:44px;text-align:right;font-size:14px}

[data-boutique="1"] {
  --bg: #09080D;

.b-stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none;margin:0 -4px 10px}

.b-story{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:none;width:72px}
.b-story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:var(--grad);box-shadow:0 0 10px rgba(226,168,118,.4);display:grid;place-items:center}
.b-story-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#201C2B;display:block}
.b-story-title{font-size:11px;font-weight:600;line-height:1.25;color:var(--text);text-align:center;max-width:72px;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.b-ship-banner{background:var(--grad-soft);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 14px;position:relative;overflow:hidden}
.b-ship-title{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin:0 0 6px}

.b-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 16px}
@media (min-width:560px){.b-grid{grid-template-columns:repeat(3,1fr)}}
.b-pcard{background:var(--card);border-radius:18px;border:1px solid var(--line2);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s}

.b-pbadge{position:absolute;top:8px;left:8px;background:rgba(15,12,22,.85);backdrop-filter:blur(6px);color:var(--accent);font-size:10.5px;font-weight:750;padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.b-pinfo{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1;justify-content:space-between;gap:6px}
.b-ptitle{font-size:13.5px;font-weight:650;line-height:1.25;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b-pprice-row{display:flex;align-items:baseline;gap:6px}
.b-pprice{font-size:15px;font-weight:750;color:var(--accent)}
.b-pold{font-size:12px;text-decoration:line-through;color:var(--faint)}
.b-pactions{display:grid;grid-template-columns:1fr;gap:6px;margin-top:4px}

.b-btn-buy{background:var(--grad);color:#1A1108;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:750;text-align:center;white-space:nowrap}
.b-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.b-row2 .btn{width:100%;padding:10px 4px;font-size:13px;white-space:nowrap;gap:5px}

.b-tinder-wrap{display:flex;flex-direction:column;align-items:center;margin:0 auto;max-width:380px;padding-bottom:80px}

.b-tinder-title{font-size:19px;font-weight:750;color:#fff;line-height:1.2}
.b-tinder-desc{font-size:12px;color:var(--muted);line-height:1.3;max-height:46px;overflow:hidden}

.b-tbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .15s}

.b-tbtn.skip{color:var(--bad);border-color:rgba(229,72,77,.3)}
.b-tbtn.try{width:48px;height:48px;color:var(--accent)}

.b-ai{background:linear-gradient(160deg,rgba(226,168,118,.16),rgba(124,108,246,.12));border:1px solid var(--line);border-radius:24px;padding:16px;margin:0 0 16px;display:flex;flex-direction:column;gap:10px}

.b-ai .row2{display:flex;gap:8px;align-items:center}

@keyframes spin{to{transform:rotate(360deg)}}

.b-wheel-box{display:flex;flex-direction:column;align-items:center;padding:16px 8px;text-align:center}

.b-capsule{background:var(--card);border-radius:22px;border:1.5px solid var(--line);padding:18px;margin:16px 0;box-shadow:var(--shadow-lg)}

.b-cart-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.b-cart-img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#1A1724;flex:none}
.b-cart-info{flex:1;min-width:0}
.b-cart-actions{display:flex;align-items:center;gap:6px}

async function api(method, payload = {}) {

  try {
    res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Init-Data": INIT}, body: JSON.stringify(payload)});
  } catch (e) { throw new Error("Немає звʼязку з сервером. Перевірте інтернет."); }
  let body = null;
  try { body = await res.json(); } catch (e) { /* не JSON */ }
  if (!body) throw new Error("Сервер тимчасово недоступний.");
  if (!body.ok) { const err = new Error(body.message || "Щось пішло не так."); err.code = body.error; throw err; }
  return body.data;
}

function smooth(pts) {
  if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : "";
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2, t = 0.18;
    const c1 = [p1[0] + (p2[0] - p0[0]) * t, p1[1] + (p2[1] - p0[1]) * t], c2 = [p2[0] - (p3[0] - p1[0]) * t, p2[1] - (p3[1] - p1[1]) * t];
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]);
    c1[1] = Math.min(Math.max(c1[1], lo), hi); c2[1] = Math.min(Math.max(c2[1], lo), hi);
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

    <path d="${line} L${w},${h} L0,${h} Z" fill="url(#ga)"/><path class="draw" d="${line}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${last ? `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}" vector-effect="non-scaling-stroke"/>` : ""}</svg>`;
}
function donut(segs, total, label) {

    <div class="dl">${segs.map((s) => `<div><i style="background:${s.c}"></i><span>${s.l}</span><b class="num">${s.t || nf(s.v)}</b></div>`).join("")}</div></div>`;

/* Швидкі відповіді: картки «назва + текст»; зберігаються в quick_replies рядками «Назва=Текст» (перенос рядка — \n) */
const QR_MAX = 10;
function qrParse(raw) {
  return String(raw || "").split("\n").map((line) => {
    const at = line.indexOf("=");
    return at > 0 ? {label: line.slice(0, at).trim(), text: line.slice(at + 1).trim().split("\\n").join("\n")} : null;
  }).filter((r) => r && r.label && r.text);
}
function qrSync() {
  $$("[data-qr-label]", $("#sheet-body")).forEach((el) => { S.qr[Number(el.dataset.qrLabel)].label = el.value; });
  $$("[data-qr-text]", $("#sheet-body")).forEach((el) => { S.qr[Number(el.dataset.qrText)].text = el.value; });
}
function qrCollect() {
  qrSync();
  const lines = [];
  for (let i = 0; i < S.qr.length; i++) {
    const label = S.qr[i].label.replace(/[=\r\n]/g, " ").replace(/\s+/g, " ").trim(), text = S.qr[i].text.trim();
    if (!label && !text) continue;
    const bad = !label ? `[data-qr-label="${i}"]` : !text ? `[data-qr-text="${i}"]` : "";
    if (bad) {
      toast(!label ? "Додайте назву кнопки" : "Додайте текст відповіді", true);
      const el = inSheet(bad);
      el.classList.add("err"); el.focus(); el.scrollIntoView({block: "center", behavior: "smooth"});
      return null;
    }
    lines.push(`${label}=${text.replace(/\r?\n/g, "\\n")}`);
  }
  return lines.join("\n");
}
function qrEditor() {
  const v = S.boot.settings;
  const auto = ["📦 Статус замовлення", v.delivery_text && "🚚 Доставка", v.payment_text && "💳 Оплата",
    v.returns_text && "🔄 Обмін", v.size_chart && "📐 Розмірна сітка"].filter(Boolean);
  const ins = (i, val, t) => `<button class="chip" data-act="qr-ins" data-i="${i}" data-ins="${val}">${ic("plus")}${t}</button>`;
  const cards = S.qr.map((r, i) => `<div class="qr-card">
      <div class="qr-head"><b>Відповідь ${i + 1}</b>
        <button class="ibtn soft sm" data-act="qr-move" data-i="${i}" data-d="-1" aria-label="Вище"${i === 0 ? " disabled" : ""}>${ic("up")}</button>
        <button class="ibtn soft sm" data-act="qr-move" data-i="${i}" data-d="1" aria-label="Нижче"${i === S.qr.length - 1 ? " disabled" : ""}>${ic("down")}</button>
        <button class="ibtn bad sm" data-act="qr-del" data-i="${i}" aria-label="Видалити">${ic("trash")}</button></div>
      <input class="inp" data-qr-label="${i}" maxlength="20" placeholder="Назва кнопки: 👋 Вітаю" value="${esc(r.label)}">
      <textarea class="inp" data-qr-text="${i}" maxlength="400" placeholder="Текст, який отримає покупець">${esc(r.text)}</textarea>
      <div class="qr-ins">${ins(i, "{ім'я}", "ім'я покупця")}${ins(i, "{магазин}", "назва магазину")}</div></div>`).join("");
  return `<div class="infobox">Кнопки під повідомленням покупця в групі менеджерів («⚡ Швидкі відповіді»). Перед відправкою менеджер бачить текст і підтверджує його.
      <div class="qr-auto"><small>Додаються самі:</small>${auto.map((a) => `<span>${a}</span>`).join("")}</div></div>
    <div class="qr-count">Ваші відповіді · ${S.qr.length} з ${QR_MAX}</div>
    ${cards || `<div class="empty">Ще немає жодної відповіді — додайте першу 👇</div>`}
    ${S.qr.length < QR_MAX ? `<button class="btn sec2" data-act="qr-add">${ic("plus")} Додати відповідь</button>` : `<div class="hint" style="text-align:center">Максимум ${QR_MAX} відповідей — приберіть зайву, щоб додати нову.</div>`}`;
}

function tryonStatusHtml() {
  const st = S.tryonStatus;
  const usd = (x) => `$${Number(x).toFixed(2)}`;
  if (!st) return `<div class="kv"><span>Статус</span><b class="muted">перевіряємо…</b></div>`;
  let rows = `<div class="kv"><span>Статус</span>${st.enabled ? `<b class="ok">працює ✓</b>` : `<b class="warn">${st.own_key || st.env_key ? "вимкнено (ліміт 0)" : "немає ключа"}</b>`}</div>`;
  if (st.key_error) rows += `<div class="kv"><span>Ключ</span><b class="warn">${st.key_error === 401 || st.key_error === 403 ? "OpenRouter його не приймає" : "OpenRouter не відповів"}</b></div>`;
  if (st.balance != null) rows += `<div class="kv"><span>Баланс OpenRouter</span><b>${usd(st.balance)} ≈ ${Math.floor(st.balance / 0.07)} примірок</b></div>`;

  return rows + `<div class="kv"><span>Цього місяця</span><b>${st.month_count} з ${st.month_limit} · ${usd(st.month_cost)}</b></div>`;
}

function initTinderSwipe() {  // тягнути картку: вправо — «подобається» (вибір розміру), вліво — далі
  const card = $("#b-tinder-card");
  if (!card) return;
  let startX = 0, startY = 0, dx = 0, dragging = false;
  const hint = (x) => {
    card.style.transform = `translateX(${x}px) rotate(${x / 18}deg)`;
    card.dataset.swipe = x > 40 ? "like" : x < -40 ? "skip" : "";
  };
  card.onpointerdown = (e) => {
    dragging = true; startX = e.clientX; startY = e.clientY; dx = 0;
    card.style.transition = "none";
    card.setPointerCapture && card.setPointerCapture(e.pointerId);
  };
  card.onpointermove = (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    if (Math.abs(e.clientY - startY) > Math.abs(dx) * 1.5 && Math.abs(dx) < 12) return;  // гортають сторінку
    hint(dx);
  };
  const finish = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = "transform .25s ease, opacity .25s ease";
    if (Math.abs(dx) < 90) { hint(0); return; }
    card.style.transform = `translateX(${dx > 0 ? 600 : -600}px) rotate(${dx > 0 ? 25 : -25}deg)`;
    card.style.opacity = "0";
    haptic(dx > 0 ? "success" : "light");
    setTimeout(() => {
      if (dx > 0) chooseSize(Number(card.dataset.pid), () => { S.tinderIdx = (S.tinderIdx || 0) + 1; render(); });
      else { S.tinderIdx = (S.tinderIdx || 0) + 1; render(); }
      if (dx > 0) { hint(0); card.style.opacity = "1"; }
    }, 220);
  };
  card.onpointerup = finish;
  card.onpointercancel = () => { if (dragging) { dragging = false; hint(0); } };
}

function initWheelCanvas() {
  const cv = $("#wheel-canvas");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const slices = (S.boot.wheel && S.boot.wheel.prizes) || [];
  if (!slices.length) return;
  const colors = ["#221C2F", "#D4AF37", "#1D1927", "#E2A876", "#2D263D"];
  const n = slices.length, arc = (Math.PI * 2) / n;

  ctx.clearRect(0, 0, 280, 280);
  ctx.save();
  ctx.translate(140, 140);
  ctx.rotate(S.wheelAngle || 0);

  for (let i = 0; i < n; i++) {
    const angle = i * arc;
    ctx.beginPath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, 136, angle, angle + arc);
    ctx.fill();
    ctx.strokeStyle = "rgba(226,168,118,.3)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.rotate(angle + arc / 2);
    ctx.fillStyle = (i % 2 === 1) ? "#1A1108" : "#F8F5FA";
    ctx.font = canvasFont(11);
    ctx.textAlign = "right";
    ctx.fillText(slices[i].length > 18 ? slices[i].slice(0, 17) + "…" : slices[i], 124, 4);
    ctx.restore();
  }
  ctx.restore();

  ctx.beginPath();
  ctx.arc(140, 140, 22, 0, Math.PI * 2);
  ctx.fillStyle = cssVar("--accent", "#E2A876");
  ctx.fill();
  ctx.fillStyle = "#1A1108";
  ctx.font = canvasFont(16, 800);
  ctx.textAlign = "center";
  ctx.fillText("🎁", 140, 146);
}

/* ── фото ── */
function shrinkImage(file, limit = 900000, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      let max = maxSide, quality = 0.86, out = "";
      for (let i = 0; i < 8; i++) {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        out = cv.toDataURL("image/jpeg", quality);
        if (out.length <= limit) break;
        if (quality > 0.7) quality -= 0.08; else max = Math.round(max * 0.8);
      }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не вдалося відкрити фото")); };
    img.src = url;
  });
}
async function uploadPhotos(productId, files) {
  readDraft();
  for (const file of files) {
    const box = inSheet("#photos");
    const ph = document.createElement("div");
    ph.className = "ph busy";
    box && box.insertBefore(ph, box.lastElementChild);
    let image;
    try { image = await shrinkImage(file); } catch (e) { toast(e.message, true); ph.remove(); continue; }
    const data = await run(null, () => api("product_photo_add", {id: productId, image}));
    ph.remove();
    if (!data) break;
    setBoot(data);

async function boot() {
  if (!INIT) { gate("outside"); return; }
  skeleton();
  try { S.boot = await api("bootstrap", {mode: "boutique"}); } catch (e) { gate(e.code === "forbidden" ? "forbidden" : e.code === "auth" ? "auth" : "error"); return; }
  const sp = new URLSearchParams(window.location.search);
  const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
  const forceBoutique = sp.get("mode") === "boutique" || startParam === "boutique" || window.location.hash.includes("boutique");

  if (S.boot.role === "customer" || forceBoutique) {
    S.mode = "boutique";
    S.tab = "b-catalog";
    applyBoutiqueTheme();
    render();
  } else {
    S.mode = "erp";
    applyBoutiqueTheme();
    if (isOwner()) { $("#tabbar").classList.remove("hidden"); render(); refreshDash(); }
    else { S.tab = "orders"; loadOrders(); }
  }
}
async function refreshDash() {
  if (!isOwner()) return;
  try {
    const d = await api("dashboard", {days: S.days});
    S.dash = d; S.boot.counts = d.counts;
    if (S.tab === "home" && !S.sheets.length) render(); else renderTabs();
  } catch (e) { if (e.code === "auth") gate("auth"); else toast(e.message, true); }
}
async function refreshAll(btn) {
  btn && btn.classList.add("spin");
  try { S.boot = await api("bootstrap", {mode: "boutique"}); } catch (e) { toast(e.message, true); }
  if (S.mode === "boutique") {
    render();
  } else {
    if (!isOwner()) S.tab = "orders";
    await refreshDash();
    if (S.tab === "orders") await loadOrders(); else render();
  }
  btn && btn.classList.remove("spin");
}
async function afterOrderChange(data, note) {
  if (!data) return;
  S.order.order = data.order;
  if (data.counts) S.boot.counts = data.counts;
  toast(note || data.message || "Збережено");
  drawSheet(true);
  const i = S.orders.findIndex((o) => o.id === data.order.id);
  if (i >= 0) S.orders[i] = data.order;
  if (S.tab === "orders") loadOrders(); else refreshDash();
}

  async "b-mystery-spin"(el) {
    if (S.wheelSpinning) return;
    S.wheelSpinning = true;
    el.disabled = true;
    const data = await run(null, () => api("mystery_box", {}));
    if (!data) { S.wheelSpinning = false; el.disabled = false; return; }  // помилку вже показав toast — приз не вигадуємо
    const slices = (S.boot.wheel && S.boot.wheel.prizes) || [];
    const n = Math.max(slices.length, 1), arc = (Math.PI * 2) / n;
    const curA = S.wheelAngle || 0;
    // стрілка зверху (−π/2): зупиняємось посередині виграного сектору
    const want = data.index >= 0 ? (Math.PI * 1.5 - (data.index + 0.5) * arc) : curA;
    const delta = ((want - curA) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const targetA = curA + (data.again ? 0 : Math.PI * 8) + delta;
    const start = performance.now();
    const duration = data.again ? 600 : 2600;
    const finish = () => {
      S.wheelSpinning = false;
      S.boot.prize = data.prize + (data.code ? ` (код ${data.code})` : "");
      S.boot.wheel_used = true;
      const res = inSheet("#wheel-res");
      if (res) res.innerHTML = `🎉 ${data.again ? "Ваш приз" : "Ви виграли"}: <b>${esc(data.prize)}</b>${data.code ? `<br><small style="color:var(--text)">Код: <b style="letter-spacing:1px">${esc(data.code)}</b></small>` : ""}<br><small style="color:var(--muted)">Додамо до замовлення автоматично</small>`;
      el.textContent = "Готово 🎁";
      haptic("success");
      render();
    };
    const step = (now) => {
      const p = Math.min(1, (now - start) / duration);
      const ease = 1 - Math.pow(1 - p, 4);
      S.wheelAngle = curA + (targetA - curA) * ease;
      initWheelCanvas();
      if (p < 1) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
  },

    if (!city) { toast("Вкажіть місто", true); return; }
    if (!warehouse) { toast("Вкажіть відділення чи поштомат", true); return; }

    const payload = {name, phone, city, warehouse, payment, comment};
    const res = await run(el, () => api("checkout", payload));
    if (res) {
      haptic("success");
      S.boot.cart = {items: [], total: 0, count: 0, free_shipping: false, shipping_left: S.boot.free_shipping_from};
      S.boot.prize = "";  // приз уже в нотатці замовлення
      S.boot.profile = {...(S.boot.profile || {}), name, phone, city, warehouse};
      S.lastOrder = res;
      await refreshStock();  // товар зарезервовано — залишки в бутіку мають це показати
      render();
      $("#toast").classList.remove("show");  // стара підказка про помилку не має висіти над успіхом
      openSheet("Замовлення оформлено", orderDoneSheet);
    }
  },
  "b-pay"(el) {
    try { tg.openLink(el.dataset.url); } catch (e) { window.open(el.dataset.url, "_blank"); }
  },
  "b-done"() {
    closeSheet(true);
    S.tab = "b-catalog";
    render();
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.tagName === "SELECT") return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", (e) => {
  const up = e.target.closest("[data-upload]");
  if (up && up.files.length) { uploadPhotos(Number(up.dataset.upload), [...up.files].slice(0, S.boot.photo_max)); up.value = ""; return; }
  const el = e.target.closest("[data-act]");
  if (el && !el.disabled) {
    const fn = A[el.dataset.act];
    if (fn) fn(el, e);
  }
});
let qTimer = 0;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; S.qFocus = true; clearTimeout(qTimer); qTimer = setTimeout(() => loadOrders(), 380); }
  if (t.dataset && (t.dataset.qrLabel != null || t.dataset.qrText != null)) t.classList.remove("err");
  if (t.dataset && t.dataset.v && S.draft) {
    const v = S.draft.variants[Number(t.dataset.i)];
    if (v) v[t.dataset.v] = t.dataset.v === "stock" ? Math.max(0, Number(t.value.replace(/\D/g, "")) || 0) : t.value;
  }
});
document.addEventListener("focusout", (e) => {
  if (e.target.id === "q") S.qFocus = false;
  if (e.target.dataset && e.target.dataset.qrText != null) e.target.dataset.caret = e.target.selectionStart;
});
boot();
</script>

<div class="demo-pill" id="demo-pill" role="note"><span>Демо · вигадані дані</span><button id="demo-theme" type="button" aria-label="Світла / темна тема" title="Світла / темна тема">☾</button></div>
<script>
(function () {
  "use strict";
  var tg = window.__demoTg, pill = document.getElementById("demo-theme");
  function sync() {
    var boutique = document.documentElement.dataset.boutique === "1";
    pill.hidden = boutique;
    pill.textContent = tg.colorScheme === "dark" ? "☀" : "☾";
  }
  pill.addEventListener("click", function () {
    tg.colorScheme = tg.colorScheme === "dark" ? "light" : "dark";
    try { applyTheme(); } catch (e) {}
    sync();
  });
  new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "data-boutique"] });
  sync();

  /* фото товарів лежать поруч із демо-файлом: URL віддаємо як є (оригінал дописує серверний префікс media/p/) */
  window.getProductPhotoUrl = function (p) { var f = p && p.photos && p.photos[0]; return f ? (f.url || "") : ""; };

  /* посилання назовні в демо не відкриваємо */
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    var h = a.getAttribute("href") || "";
    if (/^(https?:|tel:|mailto:)/.test(h)) {
      e.preventDefault(); e.stopPropagation();
      tg.showAlert("Демо: перехід за посиланням вимкнено.\n" + h);
    }
  }, true);

  /* #hash → екран:  home · orders[-new|-confirmed|-shipped|-delivered|-closed|-all] · order-<id> · products · product-<id> · product-new
     · more · settings-<shop|delivery|marketing|tryon|replies|sizes|comments> · categories · posts · boutique[-tinder|-stylist|-cart]
     (&dark / &light — тема) */
  function wait(cond, ms) { return new Promise(function (res) { var t0 = Date.now(), iv = setInterval(function () { var ok = false; try { ok = cond(); } catch (e) {} if (ok || Date.now() - t0 > (ms || 8000)) { clearInterval(iv); res(ok); } }, 60); }); }
  var routing = 0;
  async function go() {
    var tokens = (location.hash || "").slice(1).split("&"), name = tokens[0];
    if (tokens.indexOf("dark") >= 0 || tokens.indexOf("light") >= 0) {
      var want = tokens.indexOf("dark") >= 0 ? "dark" : "light";
      if (tg.colorScheme !== want && document.documentElement.dataset.boutique !== "1") { tg.colorScheme = want; try { applyTheme(); } catch (e) {} sync(); }
    }
    if (!name) return;
    var my = ++routing;
    if (!(await wait(function () { return S.boot && !document.querySelector(".sk"); }, 10000)) && !S.boot) return;
    if (my !== routing) return;
    var m, isB = /^boutique/.test(name);
    if (isB !== (S.mode === "boutique")) { A["toggle-mode"](); await wait(function () { return true; }, 50); }
    while (S.sheets.length) closeSheet(true);
    if (isB) { S.tab = { boutique: "b-catalog", "boutique-tinder": "b-tinder", "boutique-stylist": "b-stylist", "boutique-cart": "b-cart" }[name] || "b-catalog"; render(); return; }
    if (name === "home") { A.tab({ dataset: { tab: "home" } }); }
    else if ((m = /^orders(?:-(\w+))?$/.exec(name))) { S.of = m[1] || "active"; A.tab({ dataset: { tab: "orders" } }); }
    else if ((m = /^order-(\d+)$/.exec(name))) { A.tab({ dataset: { tab: "orders" } }); await wait(function () { return S.orders.length; }); openOrder(Number(m[1])); }
    else if (name === "products") { S.pcat = "all"; A.tab({ dataset: { tab: "products" } }); }
    else if ((m = /^product-(\d+|new)$/.exec(name))) { A.tab({ dataset: { tab: "products" } }); openProduct(m[1] === "new" ? null : Number(m[1])); }
    else if (name === "more") { A.tab({ dataset: { tab: "more" } }); }
    else if ((m = /^settings-(\w+)$/.exec(name))) { A.tab({ dataset: { tab: "more" } }); A["set-open"]({ dataset: { k: m[1] } }); }
    else if (name === "categories") { A.tab({ dataset: { tab: "more" } }); A["cats-open"](); }
    else if (name === "posts") { A.tab({ dataset: { tab: "more" } }); A["posts-open"]({ dataset: {} }); }
  }
  wait(function () { return typeof S !== "undefined" && S.boot; }, 10000).then(go);
  window.addEventListener("hashchange", go);
})();
</script>
